version: 2

models:
  - name: dim_movies
    description: SCD Type 2 Dimension table for cleansed movie metadata with change history
    columns:
       - name: dim_movie_key
         description: Hashed Surrogate Key- Movie_id and valid_from
         tests:
          - unique
          - not_null
        
       - name: movie_id
         description: Primary key of the movie
         tests:
          # - unique
          - not_null

       - name: movie_title
         description: Trimmed standardized movie title
         tests:
          - not_null

       - name: release_year
         description: Four-digit release year extracted from the end of the movie title.

       - name: genre_array
         description: List of genres in array format

       - name: genres
         description: Raw original pipe-delimited genre string from source
     

       - name: imdb_id
         description: "External identifier linking the movie to the Internet Movie Database (IMDb)."

       - name: tmdb_id
         description: "External identifier linking the movie to The Movie Database (TMDb)."

       - name: valid_from
         description: "Timestamp indicating when this specific version of the movie record became active."
         tests:
          - not_null

       - name: valid_to
         description: "Timestamp indicating when this version of the movie record was superseded. Defaults to 9999-12-31 for active records."
         tests:
          - not_null

       - name: is_current
         description: "Boolean flag indicating whether this row represents the latest active version of the movie (true) or a historical record (false)."
         tests:
          - not_null

  - name: dim_users
    description: A master dimension table containing unique User IDs extracted from user interactions across ratings and tags data.
    columns:
      - name: user_id
        description: The unique identifier for each user.
        tests:
          - unique
          - not_null

  - name: dim_genome_tags
    description: A dimension table cleaning and cataloging MovieLens genome tag metrics.
    columns:
      - name: tag_id
        description: The primary key identifier for each genome tag descriptor.
        tests:
          - unique
          - not_null
      - name: tag_name
        description: The standardized, clean, title-cased name of the tag category.

  - name: fct_ratings
    description: Fact table of user ratings for movies
    columns:
      - name: user_id
        description: Foreign key to dim_users
        tests:
          - not_null
      - name: movie_id
        description: Foreign key to dim_movies
        tests:
          - not_null
          - relationships:
              to: ref('dim_movies')
              field: movie_id
      - name: rating
        description: User's rating for a movie
        tests:
          - not_null
      - name: rating_timestamp
        description: Unix timestamp when the rating was made
      - name: loading_timestamp
        description: Timestamp when the record was loaded into the data warehouse (Snowflake) 
        tests:
          - not_null

  - name: fct_genome_scores
    description: Fact table of relevance scores per movie and tag
    columns:
      - name: movie_id
        description: Foreign key to dim_movies
        tests:
          - not_null
      - name: tag_id
        description: Foreign key to dim_genome_tags
        tests:
          - not_null
      - name: relevance_score
        description: Relevance score (0 to 1) for tag's association with movie
        tests:
          - not_null
      